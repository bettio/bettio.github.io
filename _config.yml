title: "Davide Bettio"
# Masthead line under the name; also the homepage <title> suffix (unless a
# `tagline` is set) and the Person description in the structured data.
description: "Open Source Developer and Creator of AtomVM"
url: "https://uninstall.it"
baseurl: ""
lang: "en"
locale: "en-US"

author:
  name: "Davide Bettio"
  type: "Person"
  url: "https://uninstall.it/"

# Photo and verified profiles, used by the masthead, the homepage, the
# homepage structured data and llms.txt. The photo is deliberately not set
# as `logo`: jekyll-seo-tag would publish it as the logo of an Organization.
profile:
  image: "/images/bettio.jpg"
  links:
    - name: "GitHub"
      url: "https://github.com/bettio"
      description: "Davide Bettio's official GitHub profile."
    - name: "Sessionize"
      url: "https://sessionize.com/bettio/"
      description: "Speaker profile and conference activities."

remote_theme: "mmistakes/so-simple-theme@3.2.0"
plugins:
- jekyll-remote-theme
- jekyll-seo-tag
